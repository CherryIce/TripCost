<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover,maximum-scale=1.0, user-scalable=no"
    />
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
    <script type="module" src="./static/js/index-B9ZvDVl5.js"></script>
    <link rel="stylesheet" href="./static/css/vendor-core-DYv600fZ.css">
    <link rel="stylesheet" href="./static/css/index-Dcqcn_rj.css">
  </head>
  <body>
    <div id="app"></div>
    <script src="./polymer/env/env.js"></script>
    <script>
      ;(function () {
        var cfg = window.__APP_CONFIG__ || {}
        var origins = []
        if (cfg.API_BASE_HOST) {
          try {
            origins.push(new URL(cfg.API_BASE_HOST).origin)
          } catch (e) {}
        }
        if (cfg.H5_BASE_HOST) {
          try {
            origins.push(new URL(cfg.H5_BASE_HOST).origin)
          } catch (e) {}
        }
        if (cfg.STATIC_FILE_API) {
          try {
            origins.push(new URL(cfg.STATIC_FILE_API).origin)
          } catch (e) {}
        }
        // 去重
        origins = origins.filter(function (v, i, a) {
          return a.indexOf(v) === i
        })
        var head = document.head
        origins.forEach(function (origin) {
          var dns = document.createElement('link')
          dns.rel = 'dns-prefetch'
          dns.href = '//' + origin.replace(/^https?:\/\//, '')
          head.appendChild(dns)
          var pre = document.createElement('link')
          pre.rel = 'preconnect'
          pre.href = origin
          pre.crossOrigin = 'anonymous'
          head.appendChild(pre)
        })
      })()
    </script>
    <noscript> This website requires JavaScript to function properly. Please enable JavaScript to continue. </noscript>
  </body>
</html>
